[versions]
# Baseline pinned by docs/adr/0003-platform-and-toolchain-baseline.md. Bumping within the
# major/minor lines fixed there is a routine version-catalog PR; crossing them needs a new ADR.
kotlin = "2.2.20"
intellij-platform-plugin = "2.17.0"
coroutines = "1.10.2"
datetime = "0.6.2"
serialization = "1.7.3"
junit = "5.11.4"
junit4 = "4.13.2"
kotest = "5.9.1"
mockk = "1.13.13"
kover = "0.9.1"
# Matches Android Studio Ladybug (2024.2.1) / AGP ~8.6's ddmlib generation, consistent with the
# docs/adr/0003 IntelliJ Platform 2024.2 (build 242) baseline.
ddmlib = "31.7.3"

[libraries]
ddmlib = { module = "com.android.tools.ddms:ddmlib", version.ref = "ddmlib" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
# Lets Gradle's useJUnitPlatform() run IntelliJ Platform's JUnit 3/4-style BasePlatformTestCase
# tests (task 007's headless platform tests) alongside plain Jupiter tests in the same module.
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junit" }
# BasePlatformTestCase ultimately extends junit.framework.TestCase (JUnit 3); needed on the
# compile classpath for task 007's platform tests, on top of the vintage engine that runs them.
junit4 = { module = "junit:junit", version.ref = "junit4" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellij-platform-plugin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
