name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and verify
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The self-hosted runner keeps ~/.gradle in a Docker volume between jobs; the GitHub cache
      # only re-uploaded the Gradle cache over the runner's home uplink after every job.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      # buildSearchableOptions and the platform/visual tests start the IDE on its JBR, which needs
      # the host's freetype/fontconfig/X11 client libraries (missing on a slim self-hosted image).
      - name: Ensure IDE runtime libraries
        run: .github/scripts/ensure-ide-runtime-libs.sh

      # `check` wires together tests, :architectureCheck (docs/adr/0001/0002), and koverVerify
      # (80% coverage floor). `verifyPlugin` runs the IntelliJ Plugin Verifier CLI.
      - name: Build, test, architecture check, and coverage gate
        run: ./gradlew clean build koverVerify --stacktrace

      - name: Verify plugin
        run: ./gradlew :intellij:verifyPlugin --stacktrace
