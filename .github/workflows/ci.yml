name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `check` wires together tests, :architectureCheck (docs/adr/0001/0002), and koverVerify
      # (80% coverage floor). The IntelliJ Plugin Verifier (`verifyPlugin`) is banned per CLAUDE.md
      # and tasks/001-project-bootstrap-quality.md's Scope — it is intentionally not run here.
      - name: Build, test, architecture check, and coverage gate
        run: ./gradlew clean build koverVerify --stacktrace

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: adb-toolbox-plugin
          path: intellij/build/distributions/*.zip
          if-no-files-found: error
