name: Prepare 1.4.2 visual references
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [stable, beta]
        default: stable
permissions:
  contents: read
jobs:
  prepare:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - run: .github/scripts/ensure-ide-runtime-libs.sh
      - name: Render changed components
        run: ./gradlew :intellij:test --tests '*CurrentAppSectionTest' --tests '*VisualRegressionTest' -PupdateVisualGoldens=true --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: release-1.4.2-visual-references
          path: intellij/src/test/resources/visual/*.png
          retention-days: 3
