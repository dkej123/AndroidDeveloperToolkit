org.gradle.jvmargs=-Xmx2048m
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
kotlin.stdlib.default.dependency=false

pluginGroup=dev.acme.adbtoolbox
# Marketplace version (release/README.md). A `v<pluginVersion>` tag publishes it to the stable
# channel, `beta-v<pluginVersion>` to the beta channel; CHANGELOG.md needs a `## [<pluginVersion>]` entry.
pluginVersion=1.1.0

# Compiled against the ADR 0003 baseline: IntelliJ Platform 2024.2+ (build 242+), no upper bound.
platformVersion=2024.2

# Filled by CI secret or a local -P argument / ORG_GRADLE_PROJECT_ variable when publishing to
# JetBrains Marketplace (release/publish.sh). Never commit a value.
intellijPlatformPublishingToken=
